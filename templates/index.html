<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Dashboard</title>
    <style>
        /* Smooth Gradient Background */
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1b1b1b, #2c2c2c, #3d3d3d);
            color: #ffffff;
            background-size: 400% 400%;
            animation: gradientAnimation 12s ease infinite;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Styling the User Card */
        .user-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 350px;
            padding: 25px;
            text-align: center;
            margin-bottom: 40px;
        }

        .user-card h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333333;
            font-weight: bold;
        }

        .user-card p {
            margin: 8px 0;
            font-size: 16px;
            color: #666666;
            line-height: 1.5;
        }

        .user-card .highlight {
            font-weight: bold;
            color: #007BFF;
        }

        /* Styling the Graph Dashboard Title */
        h1 {
            font-size: 28px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* Button Container and Styling */
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            text-transform: capitalize;
            color: #ffffff;
            background: #007BFF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #0056b3;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .user-card {
                width: 90%;
            }

            h1 {
                font-size: 24px;
            }

            button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- User Card Section -->
    <div class="user-card">
        <h2>User Information</h2>
        <p><span class="highlight">Name:</span> John Doe</p>
        <p><span class="highlight">Vehicle No:</span> ABC-1234</p>
        <p><span class="highlight">Phone No:</span> +1-234-567-8901</p>
    </div>

    <!-- Dashboard Title -->
    <h1>Graph Dashboard</h1>

    <!-- Graph Buttons -->
    <div class="button-container">
        <button onclick="window.location.href='/distance_plot'">Plot Distance Graph</button>
        <button onclick="window.location.href='/error_plot'">Plot Error Graph</button>
        <button onclick="window.location.href='/range_plot'">Plot Range Graph</button>
        <button onclick="window.location.href='/soc_plot'">Plot SOC Graph</button>
        <button onclick="window.location.href='/temp_plot'">Plot Temperature Graph</button>
        <button onclick="window.location.href='/voltage_plot'">Plot Voltage Graph</button>
    </div>

</body>
</html>
